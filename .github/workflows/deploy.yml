name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web
      - name: Build
        run: cmake --build build
      - name: Collect site
        run: |
          mkdir -p site
          cp build/index.html build/index.js build/index.wasm site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4